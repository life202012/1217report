<body>
<div id="sprite" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"></div>
<div id="app"></div>
<div id="modal"></div>
<script>
'use strict';
/* ==================== LOGIC START（純數學邏輯，不碰網頁元素） ==================== */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const lcm=(a,b)=>a/gcd(a,b)*b;
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
const factorize=n=>{const r=[];for(let p=2;p*p<=n;p++){let e=0;while(n%p===0){n/=p;e++}if(e)r.push([p,e])}if(n>1)r.push([n,1]);return r};
const flatF=n=>factorize(n).flatMap(([p,e])=>Array(e).fill(p));
const omega=n=>flatF(n).length;
const spf=n=>factorize(n)[0][0];
const sum=a=>a.reduce((x,y)=>x+y,0);
const digits=n=>String(n).split('').map(Number);
const sup=(p,e)=>e>1?`${p}<sup>${e}</sup>`:`${p}`;
const stdHTML=f=>f.map(([p,e])=>sup(p,e)).join('×');
const stdVal=f=>f.reduce((s,[p,e])=>s*Math.pow(p,e),1);
const minus=v=>v<0?'－'+(-v):String(v);
const toInt=s=>(typeof s==='string'&&/^\s*\d{1,6}\s*$/.test(s))?Number(s):null;
const PR=[];for(let i=2;i<=100;i++)if(isPrime(i))PR.push(i);
const P20=[],ODDC=[];for(let i=21;i<=99;i++){if(isPrime(i))P20.push(i);else if(i%2===1)ODDC.push(i)}
const TRAPC=[21,27,33,39,49,51,57,63,69,77,81,87,91,93,99];
const pickC=()=>Math.random()<0.8?pick(TRAPC):pick(ODDC);
function uniq(n,fn){const s=new Set();let g=0;while(s.size<n&&g++<800)s.add(fn());if(s.size<n)throw new Error('uniq failed');return [...s]}
const hasSq=f=>f.some(x=>x[1]>=2&&x[1]<=3)&&f.every(x=>x[1]<=3);
const L3_POOL=[];for(let n=40;n<=150;n++){const w=omega(n);if(w>=3&&w<=5&&hasSq(factorize(n)))L3_POOL.push(n)}
const L4_POOL=[];for(let n=48;n<=420;n++){const f=factorize(n);if(f.length>=2&&omega(n)>=3&&omega(n)<=6&&hasSq(f))L4_POOL.push(n)}
const L4B_POOL=[];for(let n=48;n<=420;n++){const f=factorize(n);if(f.length>=2&&omega(n)>=3&&omega(n)<=6)L4B_POOL.push(n)}

/* ---- 整除判別 ---- */
const RULE_TXT={3:'3 的倍數：各位數字和是 3 的倍數',4:'4 的倍數：末兩位數是 4 的倍數',5:'5 的倍數：個位數字是 0 或 5',6:'6＝2×3：要同時是 2 的倍數（個位是偶數）與 3 的倍數（各位數字和是 3 的倍數）',8:'8 的倍數：末三位數是 8 的倍數',9:'9 的倍數：各位數字和是 9 的倍數',12:'12＝3×4：要同時是 3 的倍數與 4 的倍數',15:'15＝3×5：要同時是 3 的倍數與 5 的倍數',18:'18＝2×9：要同時是 2 的倍數與 9 的倍數',20:'20＝4×5：要同時是 4 的倍數與 5 的倍數',21:'21＝3×7：要同時是 3 的倍數與 7 的倍數（7 的倍數直接用 7 去除來檢查）',36:'36＝4×9：要同時是 4 的倍數與 9 的倍數',45:'45＝5×9：要同時是 5 的倍數與 9 的倍數'};
const PARTS={2:[2],3:[3],4:[4],5:[5],6:[2,3],8:[8],9:[9],12:[3,4],15:[3,5],18:[2,9],20:[4,5],21:[3,7],36:[4,9],45:[5,9]};
function basicTest(N,k){
  const ds=digits(N),u=ds[ds.length-1];let ok,txt;
  if(k===2){ok=u%2===0;txt=`個位數字是 ${u}，${ok?'是偶數':'是奇數'}`}
  else if(k===3||k===9){const s=sum(ds);ok=s%k===0;txt=`各位數字和 ${ds.join('＋')}＝${s}，${ok?'是':'不是'} ${k} 的倍數`}
  else if(k===4){ok=(N%100)%4===0;txt=`末兩位數 ${String(N).slice(-2)}，${ok?'是':'不是'} 4 的倍數`}
  else if(k===5){ok=u===0||u===5;txt=`個位數字是 ${u}，${ok?'是':'不是'} 0 或 5`}
  else if(k===7){const q=Math.floor(N/7),r=N%7;ok=r===0;txt=ok?`${N}÷7＝${q}，整除`:`${N}÷7＝${q}…餘 ${r}，不整除`}
  else if(k===8){ok=(N%1000)%8===0;txt=`末三位數 ${String(N).slice(-3)}，${ok?'是':'不是'} 8 的倍數`}
  return {ok,txt};
}
function divTest(N,d){
  const ps=PARTS[d].map(k=>basicTest(N,k));const ok=ps.every(p=>p.ok);
  let body=ps.map(p=>p.txt).join('；');
  if(PARTS[d].length>1)body+=`；${d}＝${PARTS[d].join('×')}，${ok?'兩項都成立':'至少有一項不成立'}`;
  return {ok,body};
}
function multOf(d,lo,hi,avoid){for(let k=0;k<500;k++){const x=d*rnd(Math.ceil(lo/d),Math.floor(hi/d));if(!avoid.has(x))return x}throw new Error('multOf')}
function nearNon(d,lo,hi,avoid){
  const traps=[],all=[];for(let t=1;t<d;t++){all.push(t);if(gcd(t,d)>1)traps.push(t)}
  for(let k=0;k<800;k++){
    const m=d*rnd(Math.ceil(lo/d),Math.floor(hi/d));
    const t=(traps.length&&Math.random()<0.75)?pick(traps):pick(all);
    const x=m+t;if(x>=lo&&x<=hi&&x%d!==0&&!avoid.has(x))return x;
  }
  throw new Error('nearNon');
}
function mcFinal(o){
  if(o.options.filter(x=>x.ok).length!==1)throw new Error('MC 必須剛好一個正確：'+o.key);
  if(new Set(o.options.map(x=>x.h)).size!==o.options.length)throw new Error('選項重複：'+o.key);
  o.kind='mc';return o;
}

/* ---- 第一關：三題（3、4、5／11／12、15、20、21 的倍數），選項皆 3～4 位數 ---- */
function mcMult(d,tag,concept){
  const lens=shuffle([3,4,pick([3,4]),pick([3,4])]),rg=l=>[Math.pow(10,l-1),Math.pow(10,l)-1];
  const avoid=new Set(),nums=[],parts=PARTS[d]||[d];
  let [lo,hi]=rg(lens[0]);const good=multOf(d,lo,hi,avoid);avoid.add(good);nums.push(good);
  for(let i=1;i<4;i++){
    [lo,hi]=rg(lens[i]);
    let x=null;
    if(parts.length>1&&Math.random()<0.7){
      for(let k=0;k<500;k++){const y=rnd(lo,hi);if(y%d!==0&&!avoid.has(y)&&parts.some(p=>basicTest(y,p).ok)){x=y;break}}
    }
    if(x===null)x=nearNon(d,lo,hi,avoid);
    avoid.add(x);nums.push(x);
  }
  nums.sort((a,b)=>a-b);
  const describe=x=>{const T=divTest(x,d);return `${x}：${T.body}，所以${T.ok?'是':'不是'} ${d} 的倍數。`};
  const options=nums.map(x=>({h:String(x),ok:x%d===0,hints:[`${RULE_TXT[d]}。請檢查你選的 ${x}。`,describe(x)]}));
  return mcFinal({type:tag,key:`L1${tag}|${d}|${nums.join(',')}`,stem:`下列哪一個數是 ${d} 的倍數？`,options,explain:nums.map(describe).join('<br>'),concept,meta:{d,opts:nums}});
}
function genL1A(){const d=pick([3,4,5]);return mcMult(d,'A',`${RULE_TXT[d]}。`)}
function genL1C(){const d=pick([12,15,20,21]);return mcMult(d,'C',`${RULE_TXT[d]}。選項常常只通過其中一項檢查，所以每一項條件都要檢查完。`)}
function elevenTest(x){
  const ds=digits(x).reverse(),a=ds.filter((_,i)=>i%2===0),b=ds.filter((_,i)=>i%2===1); // 從右邊（個位）數起：第 1、3 位為奇數位
  const sa=sum(a),sb=sum(b),diff=sa-sb;
  return {ok:diff%11===0,diff,txt:`(${a.join('＋')})－(${b.join('＋')})＝${sa}－${sb}＝${minus(diff)}`};
}
function genL1B(){
  const lens=shuffle([3,4,pick([3,4]),pick([3,4])]),rg=l=>[Math.pow(10,l-1),Math.pow(10,l)-1];
  const avoid=new Set(),nums=[];
  let [lo,hi]=rg(lens[0]);const g=multOf(11,lo,hi,avoid);avoid.add(g);nums.push(g);
  for(let i=1;i<4;i++){
    [lo,hi]=rg(lens[i]);
    let x=null;
    if(Math.random()<0.5){for(let k=0;k<600;k++){const y=rnd(lo,hi);if(y%11!==0&&sum(digits(y))%11===0&&!avoid.has(y)){x=y;break}}}
    if(x===null)x=nearNon(11,lo,hi,avoid);
    avoid.add(x);nums.push(x);
  }
  nums.sort((a,b)=>a-b);
  const describe=x=>{const T=elevenTest(x);return `${x}：${T.txt}，${T.ok?'差是 0 或 11 的倍數':'差不是 0，也不是 11 的倍數'}，所以${T.ok?'是':'不是'} 11 的倍數。`};
  const options=nums.map(x=>({h:String(x),ok:x%11===0,hints:[`11 的倍數判別法：從右邊數起，把第 1、3 位（奇數位）的數字加起來，再減去第 2、4 位（偶數位）的數字和，看差是不是 0 或 11 的倍數。請算算你選的 ${x}。`,describe(x)]}));
  return mcFinal({type:'B',key:`L1B|${nums.join(',')}`,stem:`下列哪一個數是 11 的倍數？`,options,explain:nums.map(describe).join('<br>'),
    concept:`11 的倍數判別法：從右邊數起，「奇數位數字和」與「偶數位數字和」的差是 0 或 11 的倍數，這個數就是 11 的倍數。例如 5830：(0＋8)－(3＋5)＝0，所以是 11 的倍數。`,meta:{opts:nums}});
}

/* ---- 第二關 ---- */
const primeWhy=p=>{const ps=PR.filter(q=>q*q<=p);return `${p} 不能被 ${ps.join('、')} 整除（試到 ${ps[ps.length-1]} 就夠了，因為再大的質數平方會超過 ${p}），所以只有 1 和 ${p} 兩個因數，是質數。`};
const primeEx=p=>`${p} 只有 1 和 ${p} 兩個因數，是質數。`;

function genL5B(force){

function parseRows(rows){

    if(!/^\d{1,3}$/.test(b)){msgs.push(`第 ${i+1} 項的底數要填整數。`);return}
    if(e&&!/^\d{1,2}$/.test(e)){msgs.push(`第 ${i+1} 項的指數要填整數。`);return}
    if(e==='1'||e==='0'){msgs.push(`第 ${i+1} 項：指數是 1 時不用寫出來，請把指數欄清空。`);return}

}

  for(let i=1;i<list.length;i++)if(list[i].p<=list[i-1].p){out.push('底數要由小到大排列。');break}
  const allp=[...new Set(nums.flatMap(f=>f.map(x=>x[0])))];
  expected.forEach(([p,e])=>{

    if(!s){out.push(kind==='gcd'?`還有質因數沒有取到。每個數都有的質因數都要取。${detail?`（提示：${p} 在每個數都出現。）`:''}`:`還有質因數沒有取到。只要在任何一個數出現過的質因數都要取。${detail?`（提示：看看 ${p}。）`:''}`)}
    else if(s.e!==e){out.push(`${p} 的指數不對。${kind==='gcd'?'最大公因數的指數要取最小的':'最小公倍數的指數要取最大的'}。${detail?`各數中 ${p} 的指數依序是 ${es.map(x=>x||'0（沒有）').join('、')}。`:'請再看看各個數中這個質因數的指數。'}`)}

function newGame(){const o={v:1,stages:{},seen:{},usedL3:[],nid:1,view:{screen:'home',stage:null,idx:0,rec:false}};STAGES.forEach(s=>o.stages[s.k]={items:[]});return o}

const items=k=>S.stages[k].items;
const stageDone=k=>items(k).filter(i=>!i.extra&&i.done).length>=stOf(k).plan.length;
const unlocked=k=>{const i=STAGES.findIndex(s=>s.k===k);return TEACHER||i===0||stageDone(STAGES[i-1].k)};

function fresh(group,gen){
  let it;
  for(let t=0;t<80;t++){it=gen();const k=group+'|'+it.key;if(!S.seen[k]){S.seen[k]=1;return it}}
  Object.keys(S.seen).forEach(k=>{if(k.startsWith(group+'|'))delete S.seen[k]});
  S.seen[group+'|'+it.key]=1;return it;
}
function freshPool(group,pool,mk){
  let un=pool.filter(n=>!S.seen[group+'|'+n]);
  if(!un.length){Object.keys(S.seen).forEach(k=>{if(k.startsWith(group+'|'))delete S.seen[k]});un=pool.slice()}
  const n=pick(un);S.seen[group+'|'+n]=1;return mk(n);
}
function makeL4A(){
  const cand=items('L3').find(it=>it.done&&it.result&&!S.usedL3.includes(it.id));
  let n,order,src=null;
  if(cand){S.usedL3.push(cand.id);n=cand.data.n;order=cand.result.factors.slice();src=cand.id;S.seen['L4A|'+n]=1}
  else{n=freshPool('L4A',L4_POOL,x=>x);order=shuffle(flatF(n));if(Math.random()<0.1)order.sort((a,b)=>a-b)}
  return {kind:'std4a',type:'A',key:String(n),n,order,src,slots:slotsOf(n),
    concept:'標準分解式：把相同的質因數合併成指數形式，質因數由小到大排列。'};
}
function build(stage,type,nth){
  switch(stage+type){
    case 'L1A':return fresh('L1A',genL1A);
    case 'L1B':return fresh('L1B',genL1B);
    case 'L1C':return fresh('L1C',genL1C);
    case 'L2A':return fresh('L2A',genL2A);
    case 'L2B':return fresh('L2B',genL2B);
    case 'L2C':return fresh('L2C',genL2C);
    case 'L3A':return freshPool('L3',L3_POOL,genL3);
    case 'L4A':return makeL4A();
    case 'L4B':return fresh('L4B',genL4B);
    case 'L5AA':{const d=fresh('L5A',()=>genL5A(nth===0));d.color=nth>=0&&nth<2;return d}
    case 'L5BA':return fresh('L5B',()=>genL5B(nth===0?2:3));
  }
  throw new Error('unknown '+stage+type);
}
function initState(d){
  if(d.kind==='mc')return {sel:null};
  if(d.kind==='ladder1')return {layers:[{d:'',q:[''],ok:false,m:1,bad:null}],status:'work'};
  if(d.kind==='ladder3')return {layers:[{d:'',q:['','',''],ok:false,m:0,bad:null}],status:'work',gcd:'',lcm:'',gOk:false,lOk:false,gMsg:'',lMsg:''};
  if(d.kind==='std4a')return {bases:d.slots.map(()=>''),exps:d.slots.map(()=>''),badB:[],badE:[]};
  if(d.kind==='std5b')return {rows:{gcd:[{b:'',e:''},{b:'',e:''}],lcm:[{b:'',e:''},{b:'',e:''},{b:'',e:''}]},ok:{gcd:false,lcm:false},wrongG:0,wrongL:0,msg:{gcd:null,lcm:null}};
}
function addItem(stage,type,extra){
  const d=build(stage,type,extra?-1:items(stage).length);
  const it={id:S.nid++,stage,type,extra:!!extra,done:false,wrong:0,fb:null,data:d,state:initState(d),finalHTML:'',result:null};
  items(stage).push(it);return it;
}
function ensureStage(k){if(items(k).length===0)stOf(k).plan.forEach(t=>addItem(k,t,false))}
function extraType(k){
  const st=stOf(k),types=[...new Set(st.plan)];
  const cnt=t=>items(k).filter(i=>i.type===t).length;
  const m=Math.min(...types.map(cnt));return pick(types.filter(t=>cnt(t)===m));
}

function stageHTML(){

  its.forEach((x,i)=>{const n=its.slice(0,i+1).filter(y=>y.extra===x.extra).length;

  h+=`</div><div class="card">`+itemHTML(it,st)+`</div>`+(TEACHER?teacherBox(it):'');
  if(stageDone(st.k))h+=panelHTML(st);
  if(S.view.rec)h+=recordHTML(st);
  return h+`</div>`;
}
function itemHTML(it,st){
  const d=it.data,n=items(st.k).slice(0,items(st.k).indexOf(it)+1).filter(y=>y.extra===it.extra).length;
  let h=`<div class="small">${it.extra?'加練 '+n:'第 '+n+' 題'}</div>`;
  if(d.kind==='mc')h+=mcHTML(it);
  else if(d.kind==='ladder1'||d.kind==='ladder3')h+=ladderPage(it);
  else if(d.kind==='std4a')h+=std4aHTML(it);
  else if(d.kind==='std5b')h+=std5bHTML(it);
  if(it.fb)h+=`<div class="fb ${it.fb.t}">${it.fb.h}</div>`;
  if(it.done){
    const its=items(st.k),nx=its.findIndex((x,i)=>i>its.indexOf(it)&&!x.done&&!x.extra);
    const nx2=nx>=0?nx:its.findIndex(x=>!x.done&&!x.extra);
    if(nx2>=0)h+=`<button class="primary" data-act="item" data-i="${nx2}">下一題 →</button>`;
  }
  return h;
}

function ladderHTML(it){
  const st=it.state,L=st.layers,d=it.data,rows=L.length+1,R=Math.max(rows,5);
  const kc=m=>d.color?(m===3?' k3':m===2?' k2':''):'';
  let h=`<div class="ladderwrap"><div class="ladder">`;
  for(let r=0;r<rows;r++){
    const last=r===L.length,lay=L[r];
    let cells;
    if(r===0)cells=d.nums.map(x=>`<span class="c fixed">${x}</span>`);
    else{const pl=L[r-1],prev=r===1?d.nums:L[r-2].q.map(Number);cells=pl.q.map((v,i)=>pl.ok?`<span class="c okv${d.color&&prev[i]%Number(pl.d)!==0?' kc':kc(pl.m)}">${v}</span>`:`<span class="c">${inp(`layers.${r-1}.q.${i}`,v,'q',false,pl.bad&&pl.bad.q[i])}</span>`)}
    const dv=last?'':(lay.ok?`<span class="okv${kc(lay.m)}">${lay.d}</span>`:inp(`layers.${r}.d`,lay.d,'d',false,lay.bad&&lay.bad.d));
    const left=last?`<div class="lsp" style="width:calc(var(--dw) + var(--step)*${R})"></div>`
      :`<div class="lsp" style="width:calc(var(--step)*${r})"></div><div class="ldiv">${dv}</div><div class="lgap" style="width:calc(var(--step)*${R-r})"></div>`;
    h+=`<div class="lrow${last?' lastrow':''}">${left}<div class="lnums">${cells.join('')}</div></div>`;
  }

/* ----- 教師模式：顯示答案 ----- */
function teacherAnswer(it){
  const d=it.data;
  if(d.kind==='mc')return `<b>正確答案：</b>${d.options.filter(o=>o.ok).map(o=>`(${'ABCD'[d.options.indexOf(o)]}) ${o.h}`).join('')}<div class="proc">${d.explain}</div><div class="proc"><b>觀念統整：</b>${d.concept}</div>`;
  if(d.kind==='ladder1'){let c=d.n,steps=[],ds=[];while(!isPrime(c)){const p=spf(c);steps.push(`${c}÷${p}＝${c/p}`);ds.push(p);c/=p}ds.push(c);
    return `<b>參考答案：</b>${d.n}＝${ds.join('×')}<div class="proc">短除法（除數由小到大）：${steps.join('；')}，最後的商 ${c} 是質數，停止。（其他合法的質數順序也都正確）</div>`}
  if(d.kind==='ladder3'){const c=canonLayers(d.nums);let row=d.nums.slice(),lines=[`${row.join('、')}`];c.layers.forEach(l=>{row=row.map(x=>x%l.d===0?x/l.d:x);lines.push(`÷${l.d}（${l.m===3?'三數同除':'兩數同除'}）→ ${row.join('、')}`)});
    const g=c.layers.filter(l=>l.m===3).map(l=>l.d),all=c.layers.map(l=>l.d).concat(c.last.filter(x=>x!==1));
    return `<b>參考答案（其中一種合法順序）：</b><div class="proc">${lines.join('<br>')}</div><div class="proc">最大公因數＝${g.join('×')}＝${d.nums.reduce(gcd)}<br>最小公倍數＝${all.join('×')}＝${d.nums.reduce(lcm)}</div>`}
  if(d.kind==='std4a')return `<b>參考答案：</b>${d.n}＝${stdHTML(factorize(d.n))}`;
  if(d.kind==='std5b'){const A=stdAnswers(d.nums);return `<b>參考答案：</b><br>最大公因數＝${stdHTML(A.g)}＝${stdVal(A.g)}<br>最小公倍數＝${stdHTML(A.l)}＝${stdVal(A.l)}`}
  return '';
}

/* ----- 作答核對 ----- */
function finish(it,fb,fin,result){it.done=true;it.fb=fb;it.finalHTML=fin;if(result)it.result=result}
function doCheck(it){
  const d=it.data,st=it.state;
  if(it.done)return;
  if(d.kind==='mc'){
    if(st.sel===null){it.fb={t:'info',h:'請先選擇一個答案，再按「核對答案」。'};return}
    const o=d.options[st.sel];
    if(o.ok)finish(it,fbOk(`<div class="proc"><b>正確答案：</b>${o.h}</div><div class="proc">${d.explain}</div>`,d.concept),o.h);
    else{it.wrong++;const hs=o.hints.filter(Boolean);const hint=hs.length?hs[Math.min(it.wrong>2?hs.length-1:0,hs.length-1)]:'再想一想。';
      it.fb=fbBad([hint],'再想一想，這個選項不是答案');}
    return;
  }
  if(d.kind==='ladder1'||d.kind==='ladder3'){
    const L=st.layers,li=L.length-1,lay=L[li];
    if(st.status!=='work')return;
    const row=li===0?d.nums:L[li-1].q.map(Number);
    const res=d.kind==='ladder1'?checkLayer1(row[0],lay.d,lay.q[0]):checkLayer3(row,lay.d,lay.q);
    lay.bad=res.bad;
    if(res.ok){lay.ok=true;lay.m=res.m;st.status='ask';lay.bad=null;
      it.fb={t:'ok',h:`<b>✔ 這一層正確！</b>${d.kind==='ladder3'?` ${lay.d} ${res.m===3?'同時整除了三個數（三數同除，會用在最大公因數）':'整除了其中兩個數（兩數同除）'}。`:''}`};}
    else{it.wrong++;it.fb=fbBad(res.msgs)}
    return;
  }
  if(d.kind==='std4a'){
    const r=checkStd4(d.slots,st.bases,st.exps);st.badB=r.badB;st.badE=r.badE;
    if(r.ok){const f=d.slots.map(s=>[s.p,s.e]);
      finish(it,fbOk(`<div class="proc"><b>正確答案：</b>${d.n}＝${stdHTML(f)}</div><div class="proc">${d.n}＝${d.order.join('×')}（你的質因數分解）<br>由小到大排列：${d.n}＝${flatF(d.n).join('×')}<br>${f.map(([p,e])=>e>1?`${p} 出現 ${e} 次，寫成 ${p}<sup>${e}</sup>`:`${p} 只出現 1 次，直接寫 ${p} 即可`).join('；')}。</div>`,d.concept),`${d.n}＝${stdHTML(f)}`);
    }else{it.wrong++;it.fb=fbBad(r.msgs)}
    return;
  }
  if(d.kind==='std5b'){
    const A=stdAnswers(d.nums);
    ['gcd','lcm'].forEach(k=>{
      if(st.ok[k])return;
      const wk=k==='gcd'?'wrongG':'wrongL';
      const r=checkStdRows(st.rows[k],k==='gcd'?A.g:A.l,k,d.nums,st[wk]>=1);
      if(r.ok){st.ok[k]=true;st.msg[k]=null}
      else{st[wk]++;it.wrong++;st.msg[k]=`<b>✘ ${k==='gcd'?'最大公因數':'最小公倍數'}還需要修正</b><ul>${r.msgs.map(m=>`<li>${m}</li>`).join('')}</ul>`}
    });
    if(st.ok.gcd&&st.ok.lcm){
      const gv=stdVal(A.g),lv=stdVal(A.l);
      let tb=`<table class="pr"><tr><th>質因數</th>${d.nums.map((_,i)=>`<th>${'ABC'[i]} 的指數</th>`).join('')}<th>最小者</th><th>最大者</th></tr>`;
      A.ps.forEach(p=>{const es=d.nums.map(f=>expOf(f,p));const mn=Math.min(...es),mx=Math.max(...es);
        tb+=`<tr><td>${p}</td>${es.map(e=>`<td>${e?e:'X'}</td>`).join('')}<td>${mn>0?mn:'X'}</td><td>${mx}</td></tr>`});
      tb+='</table>';
      finish(it,fbOk(`<div class="proc"><b>最大公因數＝${stdHTML(A.g)}＝${A.g.map(([p,e])=>Array(e).fill(p).join('×')).join('×')}＝${gv}</b><br><b>最小公倍數＝${stdHTML(A.l)}＝${A.l.map(([p,e])=>Array(e).fill(p).join('×')).join('×')}＝${lv}</b></div><div class="proc">${tb}</div>`,d.concept),
        `最大公因數＝${stdHTML(A.g)}＝${gv}；最小公倍數＝${stdHTML(A.l)}＝${lv}`);
    }else if(st.ok.gcd||st.ok.lcm){it.fb={t:'info',h:`${st.ok.gcd?'最大公因數':'最小公倍數'}已經正確，請繼續修正另一個。`}}
    else it.fb={t:'bad',h:'兩個答案都還需要修正，請看下面的提示。'};
  }
}
function doCheckAns(it){
  const d=it.data,st=it.state;if(it.done)return;
  const nums=d.nums,G=nums.reduce(gcd),Lm=nums.reduce(lcm);
  if(!st.gOk){
    const g=toInt(st.gcd);
    if(g===null){st.gMsg='請輸入最大公因數（整數）。';it.wrong++}
    else if(g===G)st.gOk=true;
    else{it.wrong++;st.gMsg=`<b>最大公因數不對。</b> ${g>0&&nums.every(x=>x%g===0)?`${g} 是三個數的公因數，但還不是最大的。`:`${g} 不是三個數的公因數${g>0?`（${nums.find(x=>x%g!==0)} 不能被 ${g} 整除）`:''}。`}<br>提示：最大公因數只乘「三個數都能同除」的那些除數。`}
  }
  if(!st.lOk){
    const l=toInt(st.lcm);
    if(l===null){st.lMsg='請輸入最小公倍數（整數）。';it.wrong++}
    else if(l===Lm)st.lOk=true;
    else{it.wrong++;st.lMsg=`<b>最小公倍數不對。</b> ${l>0&&nums.every(x=>l%x===0)?`${l} 是三個數的公倍數，但還不是最小的。`:`${l} 不是三個數的公倍數${l>0?`（${nums.find(x=>l%x!==0)} 不能整除 ${l}）`:''}。`}<br>提示：最小公倍數＝左邊所有除數，再乘上最後一列剩下的數。`}
  }
  if(st.gOk&&st.lOk){
    const L=st.layers,ds=L.map(l=>+l.d),g3=L.filter(l=>l.m===3).map(l=>+l.d),last=L[L.length-1].q.map(Number).filter(x=>x!==1);
    finish(it,fbOk(`<div class="proc"><b>最大公因數＝${g3.join('×')}＝${G}</b>（只乘三數同除的除數）<br><b>最小公倍數＝${ds.concat(last).join('×')}＝${Lm}</b>（所有除數，再乘最後一列剩下的數）</div>`,d.concept),`最大公因數 ${G}；最小公倍數 ${Lm}`);
  }else it.fb=st.gOk||st.lOk?{t:'info',h:`${st.gOk?'最大公因數':'最小公倍數'}已經正確，請繼續修正另一個。`}:{t:'bad',h:'請看下面的提示，修改後再按「核對答案」。'};
}
function ldCont(it){
  const d=it.data,st=it.state,L=st.layers,lay=L[L.length-1];if(it.done||st.status!=='ask')return;
  const q=lay.q.map(Number);
  if(d.kind==='ladder1'){
    if(isPrime(q[0])){it.fb={t:'info',h:`目前的商 ${q[0]} 已經是質數，不能再分解了，可以停止。請按「不需要，已經完成」。`};return}
    L.push({d:'',q:[''],ok:false,m:1,bad:null});st.status='work';it.fb=null;return;
  }
  const pc=pairsCommon(q);
  if(!pc.length){it.fb={t:'info',h:`最後一列 ${q.join('、')} 已經兩兩互質，不需要再除了。請按「不用了，可以停止」。`};return}
  L.push({d:'',q:['','',''],ok:false,m:0,bad:null});st.status='work';it.fb=null;
}
function ldStop(it){
  const d=it.data,st=it.state,L=st.layers,lay=L[L.length-1];if(it.done||st.status!=='ask')return;
  const q=lay.q.map(Number);
  if(d.kind==='ladder1'){
    if(!isPrime(q[0])){it.wrong++;it.fb=fbBad([`商 ${q[0]} 還不是質數，它還能再分解（例如 ${q[0]} 可以被 ${spf(q[0])} 整除）。請按「繼續分解」。`],'還不能停止')}
    else{const fac=L.map(l=>+l.d).concat([q[0]]);
      finish(it,fbOk(`<div class="proc"><b>${d.n}＝${fac.join('×')}</b><br>因為最後的商 ${q[0]} 是質數，所以可以停止。<br>驗算：${fac.join('×')}＝${d.n}。這個結果會用在第四關。</div>`,d.concept),`${d.n}＝${fac.join('×')}`,{factors:fac});}
    return;
  }
  const pc=pairsCommon(q);
  if(pc.length){it.wrong++;const c3=common3(q);
    it.fb=fbBad([c3.length?`最後一列 ${q.join('、')} 三個數還有共同質因數 ${c3[0]}，還要繼續除。`:`最後一列 ${pc.map(x=>`${x.a} 與 ${x.b}`).join('、')} 還有共同質因數 ${pc[0].p}，還能同除，所以不能停止。請按「繼續短除法」。`],'還不能停止');return}
  st.status='ans';it.fb={t:'ok',h:`<b>✔ 短除法完成！</b>最後一列 ${q.join('、')} 兩兩互質，可以停止（不需要都除到 1）。請在下面填入最大公因數與最小公倍數。`};
}

/* ----- 事件 ----- */
function go(stage,idx){S.view={screen:'stage',stage,idx:idx==null?0:idx,rec:false};ensureStage(stage)}
function onAct(act,ds){
  ds=ds||{};const v=S.view;
  switch(act){
    case 'home':v.screen='home';break;
    case 'open':{if(!unlocked(ds.k))break;ensureStage(ds.k);const its=items(ds.k);let i=its.findIndex(x=>!x.done&&!x.extra);if(i<0)i=0;go(ds.k,i);break}
    case 'item':v.idx=Number(ds.i);v.tans=false;break;
    case 't-ans':v.tans=!v.tans;break;
    case 'teacher-toggle':location.href=location.pathname+(TEACHER?'':'?teacher=1');return;
    case 'pick':{const it=cur();if(it&&!it.done)it.state.sel=Number(ds.i);break}
    case 'check':doCheck(cur());break;
    case 'check-ans':doCheckAns(cur());break;
    case 'ld-cont':ldCont(cur());break;
    case 'ld-stop':ldStop(cur());break;
    case 'row-add':{const it=cur();if(it&&!it.done&&it.state.rows[ds.w].length<6)it.state.rows[ds.w].push({b:'',e:''});break}
    case 'row-del':{const it=cur();if(it&&!it.done&&it.state.rows[ds.w].length>1)it.state.rows[ds.w].pop();break}
    case 'extra':{const k=v.stage;if(items(k).filter(x=>x.extra).length>=MAX_EXTRA)break;const t=extraType(k);addItem(k,t,true);v.idx=items(k).length-1;v.rec=false;v.tans=false;break}
    case 'next-stage':{const i=STAGES.findIndex(s=>s.k===v.stage);const nx=STAGES[i+1];if(nx&&unlocked(nx.k))onAct('open',{k:nx.k});break}
    case 'rec':v.rec=!v.rec;break;
    case 'newgame':showModal(`<div class="box"><b>確定要重新開始嗎？</b><p>重新開始會<b>清除目前所有作答紀錄與進度</b>，並重新隨機抽題。<br>如果只是想看之前的題目，請按「取消」，再從關卡進入查看。</p><button data-act="modal-close">取消</button><button class="danger" data-act="newgame-yes">確定重新開始</button></div>`);return;
    case 'newgame-yes':S=newGame();showModal('');break;
    case 'modal-close':showModal('');return;
  }
  save();render();
}
function onInput(path,val){const it=cur();if(!it||it.done)return;setPath(it.state,path,val);save()}
function showModal(h){const m=document.getElementById('modal');m.innerHTML=h?`<div class="back">${h}</div>`:''}
function init(){
  S=load()||newGame();
  APP=document.getElementById('app');
  const sp=document.getElementById('sprite');if(sp)sp.innerHTML=SPRITE;
  APP.addEventListener('click',onClick);
  document.getElementById('modal').addEventListener('click',onClick);
  APP.addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.bind){
    let val=t.value;
    onInput(t.dataset.bind,val)}});
  APP.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.dataset&&e.target.dataset.bind){
    const it=cur();if(!it||it.done)return;
    const d=it.data;
    if(d.kind==='ladder3'&&it.state.status==='ans')onAct('check-ans');
    else if(d.kind==='ladder1'||d.kind==='ladder3'){if(it.state.status==='work')onAct('check')}
    else onAct('check');
  }});
  render();
}
function onClick(e){const b=e.target.closest&&e.target.closest('[data-act]');if(!b||b.disabled)return;onAct(b.dataset.act,b.dataset)}
init();
</script>
</body>
</html>
